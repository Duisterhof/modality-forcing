[project]
name = "modality-forcing"
version = "0.1.0"
description = "Modality Forcing: joint image-depth generation with a single DiT (text -> RGB + depth + point cloud)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Bardienus Pieter Duisterhof" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# NOTE: keep in sync with requirements.txt (HF Spaces and plain-pip users read
# that file): requirements.txt = these deps + torch + accelerate.
dependencies = [
    "einops>=0.8",
    "jaxtyping>=0.2",
    "transformers>=4.45",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "opencv-python-headless>=4.8",
    "pillow>=10",
    "matplotlib>=3.8",
    "trimesh>=4.4",
    "gradio>=6,<7",  # the interactive demo (app.py)
    "spaces",        # HuggingFace ZeroGPU runtime (no-op off-Space)
]

# PyTorch CUDA selection (uv cannot auto-detect the driver in project mode):
# pick exactly one extra matching `nvidia-smi`'s "CUDA Version", e.g.
#   uv sync --extra cu128
# Drivers older than CUDA 12.6: see the README's conda/pip path (cu118/cu121) —
# keep the torch>=2.5 floor, the cu121 index tops out at 2.5.1.
# Each extra locks the newest torch its index serves, so versions can differ
# per extra (e.g. cu128 stops at 2.11 while cu126/cu130 carry 2.12) — that skew
# in uv.lock is correct, don't "fix" it by hand.
#
# accelerate lives here, not in [project.dependencies], because it hard-depends
# on torch: in the base deps it would drag a PyPI torch (newest CUDA variant)
# into a bare `uv sync`, silently breaking GPUs on older drivers. It is still
# required at runtime — transformers' device_map= (flux_rgbd/text_encoder.py)
# needs it even though we never import it directly.
[project.optional-dependencies]
cpu = ["torch>=2.5", "accelerate>=1.0"]
cu126 = ["torch>=2.5 ; sys_platform == 'linux'", "accelerate>=1.0 ; sys_platform == 'linux'"]
cu128 = ["torch>=2.5 ; sys_platform == 'linux'", "accelerate>=1.0 ; sys_platform == 'linux'"]
cu130 = ["torch>=2.5 ; sys_platform == 'linux'", "accelerate>=1.0 ; sys_platform == 'linux'"]

[project.urls]
"Project Page" = "https://modality-forcing.github.io/"
Repository = "https://github.com/Duisterhof/modality-forcing"
Demo = "https://huggingface.co/spaces/bartduis/modality_forcing"
Paper = "https://arxiv.org/abs/2606.13676"

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu126" },
        { extra = "cu128" },
        { extra = "cu130" },
    ],
]
# linux is the only runtime that matters (CUDA model, HF Space); darwin kept so
# Apple-silicon contributors can `uv sync --extra cpu` for editing/linting
# (torch ships no x86_64 macOS wheels anymore).
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[build-system]
requires = ["uv_build>=0.11,<2"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: flux_rgbd sits at the repo root, not under src/.
module-name = "flux_rgbd"
module-root = ""

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "F722", # jaxtyping shape annotations (Float[Tensor, "b c h w"])
]
